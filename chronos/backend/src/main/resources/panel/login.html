<!DOCTYPE html>
<html>
<head><title>ChronosAC Panel Login</title><link rel="stylesheet" href="/panel.css"></head>
<body>
  <div class="login-box">
    <h1>Chronos<span style="color:var(--cyan)">AC</span></h1>
    <input id="password" type="password" placeholder="Password" autofocus>
    <button onclick="login()">Log in</button>
    <p id="error" class="error"></p>
  </div>
  <script>
    async function login() {
      const res = await fetch('/login', { method: 'POST', body: document.getElementById('password').value });
      if (res.ok) { window.location.href = '/panel.html'; }
      else { document.getElementById('error').textContent = 'Wrong password.'; }
    }
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
