listen-port: 9443

# Path (inside the container) to the anticheat-bukkit jar this backend serves for auto-update -
# see deploy/k8s/README.md's "publish a new bukkit build" section. Fine to leave pointing at a
# path that doesn't exist - auto-update is simply inert until a jar is baked into the image there.
served-plugin-jar-path: "served-plugin/anticheat-bukkit.jar"

# Where LicenseStore's SQLite file lives - point this at a persistent volume in any real
# deployment, or approval state is lost on every restart.
license-db-path: "data/anticheat.db"
# Ed25519 private key (PKCS8 PEM) this backend signs approved/revoked frames with.
license-private-key-path: "ed25519-private.pem"

# Embedded admin panel - accept/decline/disable/rebind connecting servers. Keep this off the
# MetalLB VIP in any real deployment (see docs/superpowers/specs/2026-09-16-server-licensing-design.md);
# reach it via kubectl port-forward instead.
panel-port: 9080
panel-password: "change-me"
panel-session-secret: "change-this-too-it-must-be-long"

tls:
  enabled: true
  cert-file: "cert.pem"
  key-file: "key.pem"

player-idle-timeout-seconds: 600

checks:
  KillauraA:
    enabled: true
    threshold: 10.0
    decay-rate: 1.0
  ReachA:
    enabled: true
    threshold: 10.0
    decay-rate: 1.0
