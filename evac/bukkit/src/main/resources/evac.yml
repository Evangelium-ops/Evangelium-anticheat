# Human-readable label sent to the backend as this server's name (shown in the license panel) -
# no longer needs to match any config on the backend side, since approval is now dynamic.
server-id: "example-server-1"

backend:
  host: "198.251.88.40"
  port: 9443
  tls: true
  # TLS is passed through the VPS to this certificate identity.
  tls-server-name: "192.168.50.75"
  fail-closed-grace-period-seconds: 5
  # Trust this PEM file directly instead of the JVM's system trust store - needed when the
  # backend's cert is self-signed and this server can't import it into the system trust store
  # (e.g. a read-only container rootfs). Leave blank to use the system default trust store.
  # Place the cert at plugins/Anticheat/backend-cert.pem (or wherever this points).
  trust-cert-path: "plugins/AC/backend-cert.pem"

# Where this install's instanceId and (once assigned) approval code are persisted - see
# docs/superpowers/specs/2026-09-16-server-licensing-design.md.
license-file: "license.yml"

# Punishment integration with our existing BanSystem. On a threshold crossing, dispatches the
# local `bsint-anticheat <player> <details>` console command - the same command ChunkTown /
# BanSystem-Paper / BanSystem-Folia already register, which forwards to the proxy's real
# /anticheat command and its 3-warnings-then-ban escalation (the same pipeline Vulcan's
# punishment-commands already use today). Requires one of those plugins to also be installed on
# this server; if none is, the command just fails as "unknown command" with no other effect.
bansystem-integration:
  enabled: true
  command: "bsint-anticheat"

# Network-wide violation relay to our anticheat Velocity module, separate from the bansystem
# integration above - lets staff on any backend/the proxy see alerts regardless of which server a
# violation happened on. Set true once the proxy is confirmed to have the anticheat velocity
# module installed and listening on the same channel.
relay-to-proxy: false

# AC updates come from tested KnowledgeLauncher releases on the key server.
# Standalone EVAC plugin updates cannot replace the combined AC.jar.
